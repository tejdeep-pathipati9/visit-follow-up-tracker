[project]
name = "visit-follow-up-tracker"
version = "0.1.0"
description = "Synthetic clinic visit follow-up tracking and search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    "jinja2>=3.1,<4.0",
    "openai>=3.39,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "httpx>=0.27,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
